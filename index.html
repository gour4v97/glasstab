<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Tab</title>
<link rel="icon" href="icons/icon32.png">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/glass.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>

  <!-- Background: animated mesh-gradient blobs, optional image, dim overlay -->
  <div id="bg" class="bg" aria-hidden="true">
    <div class="bg-base"></div>
    <div class="bg-blobs">
      <div class="blob b1"></div>
      <div class="blob b2"></div>
      <div class="blob b3"></div>
      <div class="blob b4"></div>
    </div>
    <img id="bg-image" class="bg-image" alt="" hidden>
    <video id="bg-video" class="bg-video" autoplay loop muted playsinline preload="metadata" hidden></video>
    <div class="bg-dim"></div>
  </div>

  <div class="page">
    <!-- Top-right quick actions -->
    <header class="top-bar">
      <div class="top-actions">
        <button id="btn-theme" class="icon-btn glass" title="Cycle theme (light / dark / auto)" aria-label="Cycle theme">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/><circle cx="12" cy="12" r="4.2"/></svg>
        </button>
        <button id="btn-settings" class="icon-btn glass" title="Settings" aria-label="Settings" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.36a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.64 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09c0 .68.4 1.3 1.03 1.56a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9c.26.63.88 1.03 1.56 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51.97z"/></svg>
        </button>
      </div>
    </header>

    <main class="hero">
      <!-- Clock + greeting -->
      <div id="clock-wrap" class="hero-clock">
        <div id="clock" class="clock">--:--</div>
        <div id="date" class="date"></div>
      </div>
      <h1 id="greeting" class="greeting"></h1>

      <!-- Search -->
      <section class="search-zone" aria-label="Search">
        <form id="search-form" class="search-pill glass" role="search">
          <span class="spark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 2l2.1 6.2L20 10l-5.9 1.8L12 18l-2.1-6.2L4 10l5.9-1.8L12 2z"/></svg>
          </span>
          <input id="search-input" type="text" placeholder="Ask anything or search…"
                 autocomplete="off" autocapitalize="off" spellcheck="false"
                 aria-label="Search or ask AI">
          <button type="submit" class="go-btn" title="Go" aria-label="Go">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </form>
        <div id="chips" class="chips" role="tablist" aria-label="Search mode">
          <button class="chip glass" data-mode="search" role="tab" aria-selected="true">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            Search
          </button>
          <button class="chip glass" data-mode="ai" role="tab" aria-selected="false">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M12 2l2.1 6.2L20 10l-5.9 1.8L12 18l-2.1-6.2L4 10l5.9-1.8L12 2z"/></svg>
            <span id="ai-chip-label">Ask AI</span>
          </button>
        </div>
      </section>

      <!-- Quick links -->
      <nav id="quicklinks" class="quicklinks" aria-label="Quick links"></nav>

      <!-- Info cards -->
      <div id="cards-row" class="cards-row">
        <section id="card-weather" class="glass-card card" aria-label="Weather">
          <div class="card-head">
            <span class="card-title">Weather</span>
            <button class="card-min" data-target="card-weather" title="Hide card" aria-label="Hide weather card">×</button>
          </div>
          <div id="weather-body" class="card-body"></div>
        </section>

        <section id="card-bookmarks" class="glass-card card" aria-label="Bookmarks">
          <div class="card-head">
            <span class="card-title">Bookmarks</span>
            <button class="card-min" data-target="card-bookmarks" title="Hide card" aria-label="Hide bookmarks card">×</button>
          </div>
          <div id="bookmarks-body" class="card-body"></div>
        </section>
      </div>
    </main>
  </div>

  <!-- Settings drawer -->
  <div id="scrim" class="scrim" hidden></div>
  <aside id="drawer" class="drawer glass" aria-label="Settings" hidden></aside>

  <div id="toast" class="toast glass" role="status" hidden></div>

<script src="js/defaults.js"></script>
<script src="js/backgrounds.js"></script>
<script src="js/search.js"></script>
<script src="js/cards.js"></script>
<script src="js/settings.js"></script>
<script src="js/main.js"></script>
</body>
</html>
